services:
  # Backend API (Apenas API, sem frontend)
  - type: web
    name: koinonia-finance-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
    healthCheckPath: /api/health
    
  # Frontend (GitHub Pages ou Vercel)
  # Configurar separadamente na plataforma de hospedagem
  # GitHub Pages: https://pages.github.com/
  # Vercel: https://vercel.com/
